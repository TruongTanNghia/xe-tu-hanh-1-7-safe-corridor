lane_reference_adapter:
  ros__parameters:
    max_skew_s: 0.12
    source_timeout_s: 0.5
    frame_id: base_link

racecar_nmpc_node:
  ros__parameters:
    # Synced from autonmous_car_research/src/race_cars at commit 0b0723b.
    target_speed_mps: 0.6
    control_rate_hz: 20.0
    prediction_horizon_s: 1.3
    horizon_steps: 10
    minimum_line_confidence: 0.5
    line_timeout_s: 0.5
    odom_timeout_s: 0.5

    # Deployment gates are outside the NMPC model and do not change its
    # simulation-equivalent parameters.
    shadow_mode: false
    model_calibrated: true

    model.mass_kg: 6.5
    model.c1: 0.5
    model.c2: 15.5
    model.cm1: 0.720766449
    model.cm2: 1.77195852
    model.cr0: 0.0763306087
    model.cr2: 0.450571997
    model.cr3: 20.0
    # Track-specific bound: widened for the physical double-lane section.
    model.cte_limit_m: 0.45
    # Physical vehicle is forward-only.
    model.drive_effort_min: 0.0
    model.drive_effort_max: 1.0
    # Measured hardware steering envelope: +/-30 degrees.
    model.steering_min_rad: -0.524
    model.steering_max_rad: 0.524
    model.drive_effort_rate_min: -12.0
    model.drive_effort_rate_max: 12.0
    model.steering_rate_min_radps: -2.5
    model.steering_rate_max_radps: 2.5
    model.longitudinal_accel_min_mps2: -2.0
    model.longitudinal_accel_max_mps2: 2.0
    model.lateral_accel_min_mps2: -2.0
    model.lateral_accel_max_mps2: 2.0
    model.footprint_front_m: 0.32
    model.footprint_rear_m: 0.32

    # Safe corridor (block D). corridor_mode:
    #   off      - lane-only NMPC, identical to the previous behaviour
    #   optional - use /planning/corridor when fresh, else lane-only bounds
    #   required - stop (REASON_CORRIDOR_STALE) when the corridor is missing
    corridor_mode: optional
    corridor_topic: /planning/corridor
    corridor_timeout_s: 0.3
    use_corridor_kappa: true
    use_corridor_speed: true
    slack_warn_m: 0.05
    slack_stop_m: 0.15
    slack_stop_cycles: 5
    publish_prediction: true
